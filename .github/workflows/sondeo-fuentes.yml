name: Sondeo de fuentes (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/sondeo_fuentes.py

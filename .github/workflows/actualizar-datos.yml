name: Actualizar datos de mercado

on:
  schedule:
    # Lunes a viernes, 10:30 a. m. y 4:30 p. m. hora de Santo Domingo (UTC-4)
    - cron: "30 14 * * 1-5"
    - cron: "30 20 * * 1-5"
  push:
    # Si editas a mano un CSV de fuentes (p. ej. TPM o inflación), se reconstruye todo
    paths:
      - "public/data/macro/fuente/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      desde:
        description: "Año inicial para cargar la serie diaria histórica (opcional, ej. 2019)"
        required: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Descargar fuentes oficiales y reconstruir datos
        run: |
          FILAS=$(wc -l < public/data/macro/fuente/tipo_cambio_diario.csv)
          if [ -n "${{ github.event.inputs.desde }}" ]; then
            python scripts/actualizar_datos.py --desde "${{ github.event.inputs.desde }}"
          elif [ "$FILAS" -lt 200 ]; then
            echo "Primera ejecución: cargando histórico diario desde 2019"
            python scripts/actualizar_datos.py --desde 2019
          else
            python scripts/actualizar_datos.py
          fi

      - name: Publicar cambios (Netlify redespliega solo)
        run: |
          git config user.name "TBRL datos"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
